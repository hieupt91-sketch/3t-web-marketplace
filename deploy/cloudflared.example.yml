# Example named-tunnel config. The owner creates the tunnel and DNS routes
# on the VPS host (see deploy/README.md); this file is only a template.
# Replace <TUNNEL_ID> and the hostnames, then run:
#   cloudflared tunnel run --config cloudflared.yml web-marketplace
tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json
ingress:
  # Main site: the compose web service published on host loopback :3000.
  - hostname: webmaket.com
    service: http://localhost:3000
  # Demo previews: every demo lives under one host as a path
  # (preview.webmaket.com/<label>/). Without this route, the main site works
  # but every demo preview fails to load.
  - hostname: "preview.webmaket.com"
    service: http://localhost:4100
  # Hosted customer sites: every <subdomain>.webmaket.com resolves through
  # the site router on :4200, which proxies to that site's own process.
  # Specific hostnames above win over this wildcard, and one label deep is
  # covered by the free Universal certificate. Needs one wildcard DNS
  # record (*.webmaket.com, proxied, to this tunnel) in Cloudflare.
  - hostname: "*.webmaket.com"
    service: http://localhost:4200
  - service: http_status:404
