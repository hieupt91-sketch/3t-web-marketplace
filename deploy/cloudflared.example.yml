# Example named-tunnel config. The owner creates the tunnel and DNS routes
# on the VPS host (see deploy/README.md); this file is only a template.
# Replace <TUNNEL_ID> and the hostnames, then run:
#   cloudflared tunnel run --config cloudflared.yml web-marketplace
tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json
ingress:
  # Main site: the compose web service published on host loopback :3000.
  - hostname: webmaket.com
    service: http://localhost:3000
  # Demo previews: one wildcard route for every demo label. Without this,
  # the main site works but every demo preview fails to load.
  - hostname: "*.preview.webmaket.com"
    service: http://localhost:4100
  - service: http_status:404
