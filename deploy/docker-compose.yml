# Staging stack for a LAN VPS behind a Cloudflare Tunnel.
# Run every command from this directory (deploy/):
#   docker compose --env-file .env up -d --build
# Only web (3000), preview (4100) and site-router (4200) are published, and
# only on 127.0.0.1, because the tunnel on the same host reaches them there. Nothing else is
# exposed to the LAN or the internet: api, worker and postgres stay inside
# the compose network. The tunnel (see cloudflared.example.yml) is run by
# the owner on the VPS host, not by this file.
services:
  postgres:
    # Digest pinned 2026-11-03 (manifest-list digest for tag
    # postgres:16-alpine, resolved via the Docker Hub registry API).
    # Re-resolve and update deliberately — never float on the tag alone.
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: api
    # H2: run as the non-root "app" user created in Dockerfile.node.
    # Requires the one-time appdata chown in the H2 cutover notes first.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - PREVIEW_INTERNAL_URL=http://preview:4100
    volumes:
      - appdata:/app/runtime-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: worker
    # NO `user:` here — INTENTIONAL. The worker is the v48 sandbox
    # privilege boundary: it chowns site fences and setuids spawned site
    # processes into the 20000-20499 UID pool (plus 19998 demo / 19999
    # import), and SANDBOX_UID_MODE=on refuses to start without euid 0.
    # It must keep running as root until spawn privilege moves to the
    # Phase 1 site-runner. Every other platform service runs non-root.
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - PREVIEW_INTERNAL_URL=http://preview:4100
      # Site servers must be reachable by the site-router container.
      - RUNTIME_BIND_HOST=0.0.0.0
    volumes:
      - appdata:/app/runtime-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  preview:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: preview
    # H2: non-root "app" user (see api). Preview only READS the shared
    # appdata volume (object store), it never writes it.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - PREVIEW_HOST=0.0.0.0
      - PREVIEW_PORT=4100
    volumes:
      - appdata:/app/runtime-data
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  site-router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: site-router
    # H2: non-root "app" user (see api). The router holds no volume and
    # writes nothing — routing state is an in-memory cache + Postgres.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - SITE_ROUTER_HOST=0.0.0.0
      - SITE_ROUTER_PORT=4200
      # Site AND demo session processes both live in the worker container
      # (sandbox Phase 0: the API no longer spawns template code); both bind
      # 0.0.0.0 inside the stack so the site router can reach them.
      - SITE_ROUTER_SITES_HOST=worker
      - SITE_ROUTER_SESSIONS_HOST=worker
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    # H2: non-root "app" user created in Dockerfile.web. The image chowns
    # /app (incl. apps/web/.next) so Next's runtime caches stay writable.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - API_INTERNAL_URL=http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  # Shared object store + work dir for api, worker and preview. Without this
  # shared volume, uploads recorded by api would be invisible to worker.
  appdata:
