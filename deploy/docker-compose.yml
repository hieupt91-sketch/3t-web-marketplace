# Staging stack for a LAN VPS behind a Cloudflare Tunnel.
# Run every command from this directory (deploy/):
#   docker compose --env-file .env up -d --build
# Only web (3000), preview (4100) and site-router (4200) are published, and
# only on 127.0.0.1, because the tunnel on the same host reaches them there. Nothing else is
# exposed to the LAN or the internet: api, worker and postgres stay inside
# the compose network. The tunnel (see cloudflared.example.yml) is run by
# the owner on the VPS host, not by this file.
services:
  postgres:
    # Digest pinned 2026-11-03 (manifest-list digest for tag
    # postgres:16-alpine, resolved via the Docker Hub registry API).
    # Re-resolve and update deliberately — never float on the tag alone.
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: api
    # H2: run as the non-root "app" user created in Dockerfile.node.
    # Requires the one-time appdata chown in the H2 cutover notes first.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - PREVIEW_INTERNAL_URL=http://preview:4100
    volumes:
      - appdata:/app/runtime-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: worker
    # NO `user:` here — INTENTIONAL. The worker still performs the v48
    # tree fencing (chown/chmod of site trees, worker-side purges) which
    # needs root. SPAWNING template code is no longer the worker's job:
    # that privilege moved to the site-runner (sandbox Phase 1, audit
    # C-01) via RUNTIME_AGENT_URL below — the worker fails closed rather
    # than spawning locally when the agent URL is set.
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - PREVIEW_INTERNAL_URL=http://preview:4100
      # Site servers must be reachable by the site-router container.
      - RUNTIME_BIND_HOST=0.0.0.0
      # Sandbox Phase 1: all template-code spawns go through the runner.
      - RUNTIME_AGENT_URL=http://site-runner:4300
    volumes:
      - appdata:/app/runtime-data
    depends_on:
      postgres:
        condition: service_healthy
      site-runner:
        condition: service_started
    restart: unless-stopped

  site-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: site-runner
    # The sandbox Phase 1 spawner (audit C-01). NO `user:` and NO env_file
    # — INTENTIONAL on both counts:
    # - It runs as root because it setuids site processes into the
    #   20000-20499 UID pool and holds NET_ADMIN for the per-UID nftables
    #   egress rules in its own network namespace.
    # - Its environment is ONLY the explicit list below (RUNNER_TOKEN is
    #   interpolated from .env by compose; the file itself is never loaded
    #   into this container). It must never see DATABASE_URL, MFA_KEY or
    #   any other platform secret — that absence is the point of Phase 1.
    # It mounts the shared appdata like the other services; the VPS
    # override additionally binds the host work/ subtree over
    # /app/runtime-data/work so site trees resolve at identical paths.
    cap_add:
      - NET_ADMIN
    environment:
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      - RUNNER_PORT=4300
      - RUNNER_WORK_ROOT=/app/runtime-data/work
      - RUNNER_SITE_GID=19990
      - RUNNER_EGRESS=on
    volumes:
      - appdata:/app/runtime-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  preview:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: preview
    # H2: non-root "app" user (see api). Preview only READS the shared
    # appdata volume (object store), it never writes it.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - PREVIEW_HOST=0.0.0.0
      - PREVIEW_PORT=4100
    volumes:
      - appdata:/app/runtime-data
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  site-router:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args:
        APP: site-router
    # H2: non-root "app" user (see api). The router holds no volume and
    # writes nothing — routing state is an in-memory cache + Postgres.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    # Read-only appdata: the serve-time SEO identity for hosted statics
    # reads the dynamic twin's seed from the object store (seo.ts layer b).
    # The router still writes nothing.
    volumes:
      - appdata:/app/runtime-data:ro
    env_file: .env
    environment:
      - DATABASE_URL=postgres://marketplace:${DB_PASSWORD}@postgres:5432/marketplace
      - SITE_ROUTER_HOST=0.0.0.0
      - SITE_ROUTER_PORT=4200
      # Site AND demo session processes both live in the site-runner
      # container (sandbox Phase 1: the runner is the only component that
      # spawns template code); both bind 0.0.0.0 inside the stack so the
      # site router can reach them.
      - SITE_ROUTER_SITES_HOST=site-runner
      - SITE_ROUTER_SESSIONS_HOST=site-runner
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
      site-runner:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    # H2: non-root "app" user created in Dockerfile.web. The image chowns
    # /app (incl. apps/web/.next) so Next's runtime caches stay writable.
    # H2 ACTIVE: the three gating fixes have landed (worker token
    # hand-off, worker-side purge, shared storage group — see the
    # h2-cutover-notes). Requires the one-time appdata chown from those
    # notes BEFORE first boot. Rollback: comment the user: line out
    # and `up -d` (the images also run as root).
    user: "10001:10001"
    env_file: .env
    environment:
      - API_INTERNAL_URL=http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  # Shared object store + work dir for api, worker and preview. Without this
  # shared volume, uploads recorded by api would be invisible to worker.
  appdata:
